name: Semantic authority integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "operation-table.lisp"
      - "scripts/check-operation-authority.sh"
      - ".github/workflows/semantic-authority.yml"

jobs:
  pinned-authority:
    runs-on: [self-hosted, author, guix]
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned semantic operation authority
        run: bash scripts/check-operation-authority.sh
